# Работающий стек в интернет не ходит. Сеть нужна только при релизе
# (docs/release.md): скачать образы, собрать API и интерфейс (pip и npm)
# и при первом запуске Strata скачать модель в том strata_data.
#
#   * pull_policy: ${PULL_POLICY:-never} — compose сам в реестр не ходит;
#     образы скачиваются только при релизе: PULL_POLICY=always docker compose pull.
#   * Модель Strata скачивает в том strata_data один раз, при первом
#     запуске; дальше читает её оттуда.
#   * Наружу может быть опубликован только интерфейс (порт 3000, адрес — в
#     WEB_BIND). Neo4j, Strata и API слушают 127.0.0.1: у Neo4j
#     Browser своей проверки прав на каталог нет, у Strata — только общий
#     ключ, а API доступен пользователям через nginx интерфейса (/api). С рабочего места к ним
#     ходят через SSH-туннель:
#       ssh -L 7474:localhost:7474 -L 7687:localhost:7687 <сервер>
#   * Логи всех контейнеров ротируются (json-file, LOG_MAX_SIZE × LOG_MAX_FILES);
#     журнал аудита API дополнительно пишется в файл на томе api_audit.
#
# Релиз (обновление и запуск) на сервере: docs/release.md

# Имя проекта задано явно, а не берётся из имени каталога: тома называются
# goal-checker_neo4j_data, goal-checker_api_audit, … где бы ни лежал клон
# (как и у прежней офлайн-установки в /opt/goal-checker). Клон в другой
# каталог поднимается на тех же томах, а не на новых пустых.
name: goal-checker

# Ротация логов docker: без неё json-file растёт без предела и забивает
# /var/lib/docker. Подключается в каждый сервис через *default-logging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-50m}
    max-file: "${LOG_MAX_FILES:-5}"

services:
  neo4j:
    image: neo4j:5.26
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"    # браузер
      - "127.0.0.1:7687:7687"    # bolt
    volumes:
      - neo4j_data:/data
      - ./neo4j/init:/init:ro
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Разовый сервис: создаёт схему графа из neo4j/init/seed.cypher (при каждом
  # подъёме стека, идемпотентно) и загружает данные из neo4j/init/data.cypher —
  # только в пустой каталог или по явному SEED_DATA=1, чтобы подъём стека не
  # откатывал правки из интерфейса. data.cypher — выгрузка этого сервера, в git
  # её нет (образец — data.example.cypher); нет файла — загружается только схема.
  # Миграции (SEED_FILE=/init/migrations/…) отмечаются узлом :Migration, и
  # применённая повторно не выполняется. Neo4j 5 не исполняет .cypher из /init
  # сам, поэтому это делает seed.py.
  seeder:
    image: goal-checker-api:${APP_VERSION:-latest}
    build: ./api
    pull_policy: never
    restart: "no"
    logging: *default-logging
    command: ["python", "seed.py"]
    environment:
      # Мимо прокси — см. комментарий у NO_PROXY сервиса api.
      NO_PROXY: strata,keycloak,neo4j,api,web,localhost,127.0.0.1,${NO_PROXY_EXTRA:-}
      no_proxy: strata,keycloak,neo4j,api,web,localhost,127.0.0.1,${NO_PROXY_EXTRA:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SEED_FILE: /init/seed.cypher
      SEED_DATA_FILE: /init/data.cypher
      # 1 — восстановить каталог из data.cypher: в одной транзакции удалить узлы
      # каталога и загрузить файл (:User, :ApiKey, :Setting, история не трогаются;
      # нет файла или он пуст — каталог не трогается).
      SEED_DATA: ${SEED_DATA:-0}
      # 1 — выполнить миграцию (SEED_FILE) повторно, даже если она уже применялась.
      SEED_REAPPLY: ${SEED_REAPPLY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./neo4j/init:/init:ro
    depends_on:
      neo4j:
        condition: service_healthy

  # Модель — Qwen3.8-Flash-Next на движке Strata (github.com/Niko1221/Strata):
  # OpenAI-совместимый API на порту 8080 контейнера. Эксперты MoE лежат в ОЗУ,
  # остальное — на GPU: IQ3_XXS занимает около 47 ГБ ОЗУ и видеопамяти вместе.
  strata:
    # Тег зафиксирован: «latest» означал бы «что скачалось при последнем
    # релизе», а версия должна быть видна в конфигурации. cuda13 — драйвер 580+.
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.7-cuda13}
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    logging: *default-logging
    labels:
      # Зависшую модель (healthcheck образа unhealthy) перезапускает autoheal.
      autoheal: "true"
    environment:
      # Мимо прокси — см. комментарий у NO_PROXY сервиса api.
      NO_PROXY: strata,keycloak,neo4j,api,web,localhost,127.0.0.1,${NO_PROXY_EXTRA:-}
      no_proxy: strata,keycloak,neo4j,api,web,localhost,127.0.0.1,${NO_PROXY_EXTRA:-}
      # Прокси только для первого запуска, когда Strata скачивает модель
      # (docs/release.md, шаг 8). Пустое значение перекрывает и прокси из
      # ~/.docker/config.json: работающая модель в интернет не ходит.
      HTTP_PROXY: ${STRATA_DOWNLOAD_PROXY:-}
      HTTPS_PROXY: ${STRATA_DOWNLOAD_PROXY:-}
      FAMILY: qwen
      MODEL: ${STRATA_MODEL:-IQ3_XXS}
      # Окно модели в токенах (32k, 64k, 128k или число); согласовано с JOB_TEXT_MAX_CHARS.
      CONTEXT: ${STRATA_CONTEXT:-32k}
      # Сколько запросов модель считает одновременно (1–8); не меньше llmMaxConcurrency.
      PARALLEL: ${STRATA_PARALLEL:-4}
      # Картинки проекту не нужны: энкодер изображений не скачивается и не грузится.
      VISION: "off"
      TUNE: ${STRATA_TUNE:-skip}
      # Ключ, который API шлёт в Authorization: Bearer (не короче 16 символов).
      # Пустой Strata заменил бы своим, и API получал бы 401.
      API_KEY: ${LLM_API_KEY:?задайте LLM_API_KEY в .env (openssl rand -hex 24)}
    ports:
      # Только с самого сервера; API ходит по сети compose (strata:8080).
      - "127.0.0.1:8000:8080"
    volumes:
      # Пакет модели (~40 ГБ), слой черновика (~6 ГБ), настройки и ключ Strata.
      # Скачиваются при первом запуске (docs/release.md) и переживают обновления.
      - strata_data:/data
    # Healthcheck — из образа: GET /v1/models с ключом, start_period 2 ч
    # (порт открывается только после загрузки модели в память).
    ulimits:
      # Движок закрепляет в ОЗУ десятки гигабайт экспертов.
      memlock: { soft: -1, hard: -1 }
    shm_size: 2gb
    # При остановке модель дорабатывает запросы и выгружается.
    stop_grace_period: 2m
    deploy:
      # 0 — сервер без GPU, модель на другом сервере (LLM_URL): сервис strata
      # не запускается при docker compose up -d.
      # Настройка в .env постоянная, в отличие от --scale strata=0.
      replicas: ${STRATA_REPLICAS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    image: goal-checker-api:${APP_VERSION:-latest}
    build: ./api
    pull_policy: never
    restart: unless-stopped
    logging: *default-logging
    # uvicorn дорабатывает идущие запросы до 45 с (api/Dockerfile) — запас,
    # чтобы docker не убил процесс раньше и история проверок успела записаться.
    stop_grace_period: 60s
    labels:
      # Зависший API (healthcheck /health в api/Dockerfile) перезапускает autoheal.
      autoheal: "true"
    # Каждая переменная, которую читает API, перечислена здесь с тем же
    # значением по умолчанию, что в коде (сверяет tests/test_deploy.py):
    # переменная из .env, которой нет в этом списке, до контейнера не доходит.
    environment:
      # Обращения между сервисами — мимо прокси. Docker подставляет в
      # контейнеры HTTP_PROXY/HTTPS_PROXY из раздела proxies в
      # ~/.docker/config.json, и без NO_PROXY запросы к strata, keycloak и даже
      # к 127.0.0.1 (healthcheck, /ready) ушли бы на корпоративный прокси,
      # который этих имён не знает. Явное значение здесь перекрывает
      # подстановку из config.json. Свои адреса, которые тоже надо исключить
      # (внешний LLM_URL, корпоративный Keycloak), — в NO_PROXY_EXTRA через
      # запятую. Как дать сеть релизу — docs/release.md.
      NO_PROXY: strata,keycloak,neo4j,api,web,localhost,127.0.0.1,${NO_PROXY_EXTRA:-}
      no_proxy: strata,keycloak,neo4j,api,web,localhost,127.0.0.1,${NO_PROXY_EXTRA:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Модель: по умолчанию Strata из этого же compose; без GPU — внешний
      # OpenAI-совместимый эндпоинт (и STRATA_REPLICAS=0 в .env).
      LLM_URL: ${LLM_URL:-http://strata:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      # Strata отвечает на любое имя модели; имя видно только в журналах.
      LLM_MODEL: ${LLM_MODEL:-strata}
      # Корневой сертификат модели по https://, если он выдан внутренним ЦС
      # (LLM_CA_FILE=/certs/<файл>); пусто — системные сертификаты.
      LLM_CA_FILE: ${LLM_CA_FILE:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      # Предохранитель: после стольких таймаутов подряд модель считается
      # недоступной на LLM_BREAKER_SECONDS, проверки сразу уходят на ручную.
      LLM_BREAKER_TIMEOUTS: ${LLM_BREAKER_TIMEOUTS:-3}
      LLM_BREAKER_SECONDS: ${LLM_BREAKER_SECONDS:-60}
      LLM_BREAKER_BULK_WAIT_SECONDS: ${LLM_BREAKER_BULK_WAIT_SECONDS:-300}
      # Сколько пакетная проверка ждёт восстановления модели от начала сбоя.
      LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-120}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-1}
      BULK_MAX_WORKERS: ${BULK_MAX_WORKERS:-16}
      BULK_MAX_REQUESTS: ${BULK_MAX_REQUESTS:-4}
      # Пакет отвечает не позже стольких секунд; пусто — 600 (таймаут nginx)
      # минус таймаут модели (LLM_TIMEOUT_SECONDS + LLM_CONNECT_TIMEOUT_SECONDS) и 15 с запаса.
      BULK_DEADLINE_SECONDS: ${BULK_DEADLINE_SECONDS:-}
      # Предел ожидающих ручных проверок; пусто — вдвое больше ёмкости модели.
      CHECK_MAX_PENDING: ${CHECK_MAX_PENDING:-}
      # Потоков обработчиков API; пусто — по ёмкости модели.
      API_THREADS: ${API_THREADS:-}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
      LLM_INTERACTIVE_RESERVE: ${LLM_INTERACTIVE_RESERVE:-1}
      CHECK_CACHE_TTL_SECONDS: ${CHECK_CACHE_TTL_SECONDS:-3600}
      CHECK_CACHE_MAX_ENTRIES: ${CHECK_CACHE_MAX_ENTRIES:-20000}
      SMART_CACHE_TTL_SECONDS: ${SMART_CACHE_TTL_SECONDS:-86400}
      JOB_DESCRIPTIONS_CACHE_TTL_SECONDS: ${JOB_DESCRIPTIONS_CACHE_TTL_SECONDS:-60}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-365}
      SMART_SCORE_RETENTION_DAYS: ${SMART_SCORE_RETENTION_DAYS:-365}
      # Согласовано с окном модели (STRATA_CONTEXT): меняйте вместе.
      JOB_TEXT_MAX_CHARS: ${JOB_TEXT_MAX_CHARS:-24000}
      # Выписка обязанностей из инструкции идёт в фоне, со своим таймаутом.
      DUTIES_MAX_TOKENS: ${DUTIES_MAX_TOKENS:-4096}
      DUTIES_TIMEOUT_SECONDS: ${DUTIES_TIMEOUT_SECONDS:-600}
      DUTIES_WORKERS: ${DUTIES_WORKERS:-1}
      MAX_GOALS_PER_REQUEST: ${MAX_GOALS_PER_REQUEST:-200}
      CHECK_RATE_PER_MINUTE: ${CHECK_RATE_PER_MINUTE:-600}
      GOAL_MAX_CHARS: ${GOAL_MAX_CHARS:-4000}
      PROMPT_EXAMPLES_PER_KIND: ${PROMPT_EXAMPLES_PER_KIND:-2}
      PROMPT_EXAMPLE_MAX_CHARS: ${PROMPT_EXAMPLE_MAX_CHARS:-300}
      ADVICE_MAX_ATTEMPTS: ${ADVICE_MAX_ATTEMPTS:-3}
      ADVICE_MAX_EXAMPLES: ${ADVICE_MAX_EXAMPLES:-40}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Журнал аудита: файл на томе api_audit с ежедневной ротацией, плюс stdout.
      AUDIT_LOG_DIR: /data/audit
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      AUDIT_MAX_FILE_MB: ${AUDIT_MAX_FILE_MB:-100}
      # Предел объёма всех файлов журнала; пусто — значение по умолчанию в api/audit.py.
      AUDIT_MAX_TOTAL_MB: ${AUDIT_MAX_TOTAL_MB:-}
      # Отправка журнала аудита в SIEM (syslog RFC 5424): udp://, tcp:// или tls://хост[:порт];
      # пусто — не отправляется. CA_FILE — корень внутреннего ЦС для tls:// (/certs/<файл>),
      # HOSTNAME — имя сервера в строках syslog (по умолчанию — имя контейнера).
      AUDIT_SYSLOG_URL: ${AUDIT_SYSLOG_URL:-}
      AUDIT_SYSLOG_CA_FILE: ${AUDIT_SYSLOG_CA_FILE:-}
      AUDIT_SYSLOG_HOSTNAME: ${AUDIT_SYSLOG_HOSTNAME:-}
      AUDIT_SYSLOG_APP_NAME: ${AUDIT_SYSLOG_APP_NAME:-goal-checker}
      # Вход в интерфейс: кто пользователь — решает Keycloak, роли — реестр в Neo4j.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CA_FILE: ${KEYCLOAK_CA_FILE:-}
      KEYCLOAK_TIMEOUT_SECONDS: ${KEYCLOAK_TIMEOUT_SECONDS:-5}
      AUTH_ADMIN_LOGINS: ${AUTH_ADMIN_LOGINS:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
    ports:
      # Только с самого сервера: /ready, диагностика, Swagger на стенде.
      - "127.0.0.1:8080:8080"
    volumes:
      # Смонтировано на запись, чтобы export_graph.py мог записать data.cypher
      # (процесс работает от uid 10001: нужна запись в файл, см. docs/deployment.md;
      # без неё выгрузка идёт через --stdout).
      - ./neo4j/init:/init
      # Корневые сертификаты внутреннего ЦС для Keycloak и модели по https
      # (KEYCLOAK_CA_FILE, LLM_CA_FILE = /certs/<файл>).
      - ./certs:/certs:ro
      # Журнал аудита переживает пересоздание контейнера и обновления.
      - api_audit:/data/audit
    depends_on:
      neo4j:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
      # Модель API не нужна для старта: каталог, вход и настройки работают,
      # пока Strata грузит модель, а готовность модели видна в /ready.
      # required: false — стек поднимается и без сервиса strata (STRATA_REPLICAS=0).
      strata:
        condition: service_started
        required: false

  # Интерфейс на React: статика собирается в образ (web/Dockerfile) при
  # релизе; в работающем контейнере только nginx — node и npm не нужны.
  web:
    image: goal-checker-web:${APP_VERSION:-latest}
    build: ./web
    pull_policy: never
    restart: unless-stopped
    logging: *default-logging
    environment:
      TRUSTED_PROXY: ${TRUSTED_PROXY:-127.0.0.1}
      # Предел запросов к API с одного адреса: в секунду и всплеск сверх него (nginx limit_req).
      API_RATE_LIMIT: ${API_RATE_LIMIT:-50}
      API_RATE_BURST: ${API_RATE_BURST:-200}
      # Браузер ходит в Keycloak напрямую: его origin разрешается в Content-Security-Policy.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
    ports:
      # Адрес, на котором слушает интерфейс. 127.0.0.1 — когда TLS-прокси на
      # этом же сервере (тогда в обход TLS к порту 3000 не подключиться);
      # 0.0.0.0 или адрес интерфейса — когда прокси на другой машине.
      - "${WEB_BIND:-0.0.0.0}:3000:80"

  # Автоперезапуск зависших контейнеров. Docker без Swarm по статусу
  # unhealthy не перезапускает: restart: unless-stopped срабатывает, только
  # когда процесс завершился, а зависшие Strata или API живы. autoheal раз в
  # AUTOHEAL_INTERVAL секунд перезапускает контейнеры с меткой autoheal=true
  # (strata, api), у которых healthcheck в состоянии unhealthy; пока идёт
  # start_period (у Strata — 2 часа на загрузку модели), unhealthy не бывает.
  # Образ скачивается при релизе вместе с остальными (шаг 6), тег закреплён.
  # Нужен доступ к docker.sock — это права root на хосте; если так нельзя,
  # AUTOHEAL_REPLICAS=0 и systemd-таймер (docs/deployment.md).
  autoheal:
    image: ${AUTOHEAL_IMAGE:-willfarrell/autoheal:1.2.0}
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    logging: *default-logging
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL:-30}
      AUTOHEAL_START_PERIOD: 0
      # Сколько секунд docker ждёт остановки перед kill: API дорабатывает
      # запросы до 45 с (stop_grace_period: 60s).
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: ${AUTOHEAL_REPLICAS:-1}

volumes:
  neo4j_data:
  api_audit:
  strata_data:
