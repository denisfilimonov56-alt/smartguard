# Надстройка для разработки: стек ходит в интернет и во время работы.
#
#   docker compose -f docker-compose.yml -f docker-compose.online.yml up -d --build
#
# Со стендовым Keycloak — ещё -f docker-compose.stand.yml перед этим файлом.
#
# Снимает запреты базового файла: образы докачиваются, если их нет локально.
# Сервер этот файл не использует: образы скачиваются при релизе
# (docs/release.md), а стек работает без сети.

services:
  neo4j:
    pull_policy: missing
  seeder:
    pull_policy: build
  api:
    pull_policy: build
  web:
    pull_policy: build
  autoheal:
    pull_policy: missing
  strata:
    pull_policy: missing
